<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><style>@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.f{opacity:0;animation:rise .5s ease-out both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.k{animation:blink 1s step-end infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0b0f15"/></linearGradient></defs><rect width="840" height="430" rx="24" fill="url(#bg)"/><rect x="0.5" y="0.5" width="839" height="429" rx="24" fill="none" stroke="#30363d"/><line x1="0" y1="68" x2="840" y2="68" stroke="#30363d"/><circle cx="40" cy="34.0" r="11.0" fill="#ff5f56"/><circle cx="76" cy="34.0" r="11.0" fill="#ffbd2e"/><circle cx="112" cy="34.0" r="11.0" fill="#27c93f"/><text x="420.0" y="43.0" fill="#7d8590" font-size="26" text-anchor="middle">raghav@github: ~/projects/gitventure</text><text x="36" y="114" fill="#7d8590" font-size="20"><tspan fill="#22d3ee">$</tspan> cat README.md | head -1</text><clipPath id="n"><rect x="36" y="134" width="0" height="60"><animate attributeName="width" values="0;28;55;83;110;138;166;193;221;248;280" calcMode="discrete" begin="0.2s" dur="0.6s" fill="freeze"/></rect></clipPath><text clip-path="url(#n)" x="36" y="180" fill="#e6edf3" font-size="46" font-weight="700">GitVenture</text><rect class="k" x="320" y="142" width="23" height="46" fill="#22d3ee" opacity="0.8"/><g class="f" style="animation-delay:0.60s"><rect x="616" y="146" width="188" height="40" rx="20" fill="#f2cc60" fill-opacity="0.12" stroke="#f2cc60" stroke-opacity="0.7"/><text x="710" y="173" fill="#f2cc60" font-size="20" font-weight="700" text-anchor="middle">HackRice 2026</text></g><g class="f" style="animation-delay:0.75s"><text x="36" y="236" fill="#c9d1d9" font-size="24">Turns GitHub issues into RPG quests. A Chrome</text><text x="36" y="272" fill="#c9d1d9" font-size="24">extension puts AI-rated XP on every issue, and XP</text><text x="36" y="308" fill="#c9d1d9" font-size="24">only unlocks when a maintainer merges your PR.</text></g><g class="f" style="animation-delay:0.95s"><rect x="36" y="356" width="142" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="107" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">TypeScript</text><rect x="190" y="356" width="85" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="232" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">React</text><rect x="287" y="356" width="96" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="335" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">Gemini</text><rect x="395" y="356" width="119" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="455" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">Postgres</text></g></svg>