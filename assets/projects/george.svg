 class="bn" x="208.5" y="141.8" width="24.8" height="48.3" fill="#22d3ee"/><g class="f" style="animation-delay:0.60s"><rect x="676" y="146" width="128" height="40" rx="20" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.7"/><text x="740" y="173" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle">Voice AI</text></g><g class="f" style="animation-delay:0.75s"><text x="36" y="236" fill="#c9d1d9" font-size="24">Hands-free voice agent for auto mechanics. Ask for</text><text x="36" y="272" fill="#c9d1d9" font-size="24">torque and install specs out loud and get a short</text><text x="36" y="308" fill="#c9d1d9" font-size="24">answer grounded in shop manuals.</text></g><g class="f" style="animation-delay:0.95s"><rect x="36" y="356" width="96" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="84" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">Python</text><rect x="144" y="356" width="74" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="181" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">Vapi</text><rect x="230" y="356" width="96" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="278" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">Qdrant</text><rect x="338" y="356" width="62" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="370" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">RAG</text></g></svg>