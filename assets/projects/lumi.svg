<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><style>@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.f{opacity:0;animation:rise .5s ease-out both}@keyframes wn{from{transform:translateX(0)}to{transform:translateX(110.4px)}}.wn{animation:wn 0.60s steps(4) 0.20s both}@keyframes cn{from,to{opacity:.85}}.cn{opacity:0;animation:cn 0.75s 0.20s}@keyframes bn{0%,49%{opacity:.85}50%,100%{opacity:0}}.cn{opacity:0;animation:bn 1s step-end 0.20s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}.tw,.cf{display:none!important}}</style><defs><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="430"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0b0f15"/></linearGradient></defs><rect width="840" height="430" rx="24" fill="url(#bg)"/><rect x="0.5" y="0.5" width="839" height="429" rx="24" fill="none" stroke="#30363d"/><line x1="0" y1="68" x2="840" y2="68" stroke="#30363d"/><circle cx="40" cy="34.0" r="11.0" fill="#ff5f56"/><circle cx="76" cy="34.0" r="11.0" fill="#ffbd2e"/><circle cx="112" cy="34.0" r="11.0" fill="#27c93f"/><text x="420.0" y="43.0" fill="#7d8590" font-size="26" text-anchor="middle">raghav@github: ~/projects/lumi</text><text x="36" y="114" fill="#7d8590" font-size="20"><tspan fill="#22d3ee">$</tspan> cat README.md | head -1</text><text x="36" y="180" fill="#e6edf3" font-size="46" font-weight="700" textLength="110.4" lengthAdjust="spacingAndGlyphs">Lumi</text><clipPath id="kn"><rect x="34.0" y="136.3" width="155.8" height="59.8"/></clipPath><g class="tw" clip-path="url(#kn)"><g class="wn"><rect x="35.0" y="136.3" width="155.8" height="59.8" fill="url(#bg)"/><rect class="cn" x="36.0" y="141.8" width="24.8" height="48.3" fill="#22d3ee"/></g></g><g class="f" style="animation-delay:0.60s"><rect x="640" y="146" width="164" height="40" rx="20" fill="#f2cc60" fill-opacity="0.12" stroke="#f2cc60" stroke-opacity="0.7"/><text x="722" y="173" fill="#f2cc60" font-size="20" font-weight="700" text-anchor="middle">HackTX 2026</text></g><g class="f" style="animation-delay:0.75s"><text x="36" y="236" fill="#c9d1d9" font-size="24">Turns a phone camera into spoken, step-by-step</text><text x="36" y="272" fill="#c9d1d9" font-size="24">guidance for blind and low-vision users, confirming</text><text x="36" y="308" fill="#c9d1d9" font-size="24">every step on camera before moving on.</text></g><g class="f" style="animation-delay:0.95s"><rect x="36" y="356" width="142" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="107" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">TypeScript</text><rect x="190" y="356" width="96" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="238" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">Python</text><rect x="298" y="356" width="142" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="369" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">Muse Spark</text><rect x="452" y="356" width="119" height="38" rx="8" fill="#161b22" stroke="#30363d"/><text x="512" y="382" fill="#e6edf3" font-size="19" text-anchor="middle">three.js</text></g></svg>