name: Refresh profile art

# Redraws the contribution graph, stats card, and project cards from live data.
# Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "data/projects.json", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-profile-art
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats and render SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/refresh.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile art"
            git push
          fi
